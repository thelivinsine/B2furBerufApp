name: Deploy Supabase functions

# The founder has no CLI, and nothing else in this repo deploys Supabase: the
# site ships via pages.yml, but Edge Functions and migrations were manual
# `supabase ...` commands. This workflow removes that ops burden entirely.
#
# ONE-TIME SETUP (all in the browser, GitHub → Settings → Secrets and variables
# → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  - Supabase Dashboard → Account → Access Tokens.
#                            NOTE: these can be created with an expiry. When it
#                            lapses, deploys fail with a clear error telling you
#                            to regenerate it (see the "Verify access token"
#                            step); nothing deploys half-way.
#   SUPABASE_DB_PASSWORD   - the database password (only needed for migrations;
#                            leave it unset and the migration step is skipped).
#                            SET 2026-07-31. NOTE: migrations 0001-0013 were
#                            applied by hand in the SQL editor and therefore are
#                            NOT in supabase_migrations. Run this workflow once
#                            with `repair_applied` listing them before the first
#                            `db push`, or push replays 0001 and fails.
# The project ref is not a secret and is set below.
#
# Until SUPABASE_ACCESS_TOKEN exists the workflow SKIPS cleanly instead of
# failing, so merging this file changes nothing on its own.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Also apply pending migrations (supabase db push)"
        type: boolean
        default: true
      list_only:
        description: "Diagnose only: print local vs remote migration history and stop"
        type: boolean
        default: false
      repair_applied:
        description: "Space-separated migration versions to MARK as already applied (bookkeeping only, runs no SQL)"
        type: string
        default: ""
      probe_schema:
        description: "Diagnose only: print which tables/columns the live database actually has"
        type: boolean
        default: false
      snippets:
        description: "Diagnose only: print the dashboard SQL Editor's saved queries with what each one did"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys against the same project at once.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: stkfdavpjflpqoxjunnj

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (not floating tags) to remove the
      # tag-hijack supply-chain risk, matching pages.yml.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set, skipping. See the header of this workflow for the one-time setup."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$DB_PASSWORD" ]; then
            echo "db=false" >> "$GITHUB_OUTPUT"
          else
            echo "db=true" >> "$GITHUB_OUTPUT"
          fi

      # NOTE: every other action in this repo is pinned to a commit SHA. This
      # one is pinned to the v1 TAG because the sandbox that authored the file
      # has no network access and could not verify a real SHA (the first attempt
      # used an invented one and the run failed at action resolution). Re-pin to
      # a verified SHA when someone with network can look it up; the floating
      # tag is an accepted, documented exception until then.
      - name: Setup Supabase CLI
        if: steps.creds.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # A Supabase access token can be created with an expiry. When it lapses
      # every deploy fails with an opaque 401, so check it ONCE up front and say
      # plainly what to do, rather than leaving a non-technical operator staring
      # at a stack trace.
      - name: Verify access token
        if: steps.creds.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ! supabase projects list > /dev/null 2>&1; then
            echo "::error::SUPABASE_ACCESS_TOKEN was rejected. It has most likely EXPIRED. Generate a new one at Supabase Dashboard -> Account -> Access Tokens, then update the SUPABASE_ACCESS_TOKEN secret in GitHub -> Settings -> Secrets and variables -> Actions. Nothing was deployed."
            exit 1
          fi

      # The dashboard SQL Editor's saved queries. They are DASHBOARD objects, not
      # database objects, and they accumulated as "Untitled query" while every
      # migration was pasted by hand.
      #
      # They cannot be renamed from here: the Management API exposes GET
      # /v1/snippets and GET /v1/snippets/{id} and nothing else. A PATCH against
      # all twelve returned `404 Cannot PATCH /v1/snippets/{id}` on 2026-07-31,
      # so renaming is a dashboard-only action (founder asked; this is the tested
      # answer, not an assumption). What this step CAN do is print the inventory:
      # id, current name, and the first meaningful line of SQL, which is what
      # makes renaming them by hand a minute's work.
      #
      # They are historical either way: migrations live in supabase/migrations
      # and apply themselves on merge, so deleting these is equally fine.
      - name: SQL Editor snippets
        if: >-
          steps.creds.outputs.configured == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.snippets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          api="https://api.supabase.com/v1"
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          # api.supabase.com sits behind Cloudflare and served a 502 HTML page
          # mid-session on 2026-07-31, which jq then reported as a parse error.
          # Always check the status and retry, so an outage reads as an outage.
          get() {
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/api.json -w '%{http_code}' -H "$auth" "$1")
              [ "$code" = "200" ] && { cat /tmp/api.json; return 0; }
              echo "::warning::GET $1 -> HTTP $code (attempt $attempt)" >&2
              sleep 5
            done
            echo "::error::GET $1 failed after 3 attempts: HTTP $code" >&2
            head -c 300 /tmp/api.json >&2
            return 1
          }
          list=$(get "$api/snippets?project_ref=$SUPABASE_PROJECT_REF&limit=100") || exit 1
          for id in $(echo "$list" | jq -r '.data[]?.id'); do
            body=$(get "$api/snippets/$id") || continue
            first=$(echo "$body" | jq -r '.content.sql // ""' \
              | grep -v '^\s*--' | grep -v '^\s*$' | head -1 | cut -c1-90)
            echo "  $id :: $(echo "$body" | jq -r '.name') :: $first"
          done

      # Read-only evidence about the LIVE schema, via the Management API's query
      # endpoint (the same thing the dashboard SQL editor drives). Needed before
      # any repair: marking a version applied skips its SQL forever, so it must
      # only ever be done for DDL the database demonstrably already carries.
      - name: Schema probe
        if: >-
          steps.creds.outputs.configured == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.probe_schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          read -r -d '' SQL <<'EOSQL' || true
          select 'table:' || table_name as item
            from information_schema.tables
           where table_schema = 'public'
          union all
          select 'column:' || table_name || '.' || column_name
            from information_schema.columns
           where table_schema = 'public'
             and table_name in ('progress', 'writing_evaluations')
          union all
          select 'function:' || p.proname
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public'
          union all
          select 'policy:' || tablename || '.' || policyname
            from pg_policies
           where schemaname = 'public'
          union all
          select 'recorded_migration:' || version
            from supabase_migrations.schema_migrations
          order by 1
          EOSQL
          payload=$(jq -Rn --arg q "$SQL" '{query: $q}')
          curl -sS -X POST             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             -d "$payload" | jq -r '.[]?.item // .'

      # Read-only diagnosis. Every migration up to 0013 was pasted into the SQL
      # editor by hand, which does NOT write to supabase_migrations, so the
      # remote history can be empty while the schema is fully up to date. When
      # that is the case `db push` tries to replay 0001 and dies on an object
      # that already exists (which is exactly what happened on 2026-07-31). This
      # step shows the truth before anything is changed.
      - name: Migration status
        if: >-
          steps.creds.outputs.configured == 'true' &&
          steps.creds.outputs.db == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.list_only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list

      # Bookkeeping repair: tells Supabase "these versions are already in the
      # database" WITHOUT running their SQL. This is the one-time bridge from
      # hand-pasted migrations to an automated pipeline; after it, `db push`
      # applies only genuinely new files. Never mark a version applied unless the
      # schema really carries it: the SQL is skipped forever after.
      - name: Repair migration history
        if: >-
          steps.creds.outputs.configured == 'true' &&
          steps.creds.outputs.db == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          !inputs.list_only &&
          inputs.repair_applied != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERSIONS: ${{ inputs.repair_applied }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          for v in $VERSIONS; do
            echo "::group::repair $v"
            supabase migration repair --status applied "$v"
            echo "::endgroup::"
          done
          supabase migration list

      # Migrations run BEFORE the functions. evaluate-writing writes
      # writing_evaluations.task_id, which migration 0011 adds; deploying the
      # function first would degrade it to "no task reference" (the insert is
      # guarded, so nothing is lost, but the reference would be missing).
      - name: Apply migrations
        if: >-
          steps.creds.outputs.configured == 'true' &&
          steps.creds.outputs.db == 'true' &&
          (github.event_name != 'workflow_dispatch' || (inputs.run_migrations && !inputs.list_only))
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # --include-all: apply every migration the remote has not recorded,
          # even one numbered BELOW the newest applied version. Without it the
          # CLI refuses an out-of-order file, which is the normal state here:
          # the history was repaired from hand-pasted migrations, so a genuinely
          # missing older one (0010) sits below a recorded newer one (0013).
          # Every migration in this repo is written to be idempotent, which is
          # what makes "apply whatever is unrecorded" the safe semantics.
          supabase db push --include-all

      - name: Deploy Edge Functions
        if: steps.creds.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for fn in supabase/functions/*/; do
            name="$(basename "$fn")"
            # Shared, non-deployable directories would start with _ by convention.
            case "$name" in _*) continue ;; esac
            echo "::group::deploy $name"
            # Bundling fetches the function's imports from esm.sh, which returned
            # 522 mid-session on 2026-07-31 and failed the whole deploy. Retry
            # rather than let a CDN wobble block a release.
            for attempt in 1 2 3; do
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" && break
              if [ "$attempt" = "3" ]; then
                echo "::error::deploy $name failed after 3 attempts"
                exit 1
              fi
              echo "::warning::deploy $name failed (attempt $attempt), retrying"
              sleep 10
            done
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.configured }}" != "true" ]; then
            echo "Skipped: add SUPABASE_ACCESS_TOKEN to deploy automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployed Edge Functions to $SUPABASE_PROJECT_REF." >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ steps.creds.outputs.db }}" != "true" ]; then
              echo "Migrations skipped (no SUPABASE_DB_PASSWORD)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
