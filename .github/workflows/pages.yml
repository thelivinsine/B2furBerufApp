name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (not floating tags) to remove the
      # tag-hijack supply-chain risk. The trailing comment records the version.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # Turnstile site key is public (safe to embed in the JS bundle).
          # Set this secret in GitHub → Settings → Secrets → Actions.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      # Two different failures live here, and they need opposite answers.
      #
      # 1. The TIMEOUT (s196/s197, the one that kept turning this workflow red).
      #    `actions/deploy-pages` waits `timeout` ms for the deployment to
      #    report success and CANCELS ITSELF when it runs out. The default is
      #    600000 (10 min) and a deployment for this repo regularly needs more:
      #    run #820 sat in `deployment_in_progress` for the full 10 minutes,
      #    self-cancelled, and only went live because attempt 2 re-created it.
      #    Worse, the cancelled leftover sometimes refuses the NEXT merge
      #    outright ("in progress deployment. Please cancel <sha> first"), which
      #    is why a green build can be followed by no deploy run at all.
      #    Attempt 1 therefore gets 30 minutes, so ONE attempt can outlast a
      #    slow deploy and there is nothing left over to poison the next push.
      #
      # 2. The transient PLATFORM error ("Deployment failed, try again later"),
      #    which is not a code issue (the build + artifact upload already
      #    succeeded in the build job) and has recurred on several merges,
      #    including twice on 2026-07-04 when Pages was briefly degraded. That
      #    one fails fast, so the two retries keep the shorter 10-minute wait:
      #    a genuine outage still surfaces in reasonable time instead of holding
      #    the job for an hour and a half. Attempts 1 and 2 fail soft with
      #    growing pauses; attempt 3 fails hard, so an outage surfaces as red
      #    rather than silently shipping nothing.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 1800000

      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 600000

      - name: Pause before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 600000
