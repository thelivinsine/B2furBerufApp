<!doctype html>
<html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Speaker-Buttons rechtsbündig</title>
<style>
  :root{--surface:0 0% 100%;--foreground:252 16% 12%;--muted-foreground:220 8% 36%;--border:218 13% 84%;--primary:221 83% 54%;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:hsl(180 45% 96%);color:hsl(var(--foreground));padding:40px 24px 80px}
  h1{font-size:22px;margin-bottom:6px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--primary));font-weight:700;margin:32px 0 12px}
  .wrap{max-width:520px;overflow-x:auto;border-radius:12px;border:1px solid hsl(var(--border));background:hsl(var(--surface))}
  table{min-width:100%;border-collapse:collapse;font-size:14px}
  thead tr{border-bottom:1px solid hsl(var(--border))}
  th{text-align:left;text-transform:uppercase;letter-spacing:.04em;font-size:11px;color:hsl(var(--muted-foreground));font-weight:600;padding:12px}
  tbody tr{border-bottom:1px solid hsl(var(--border)/.6)}
  tbody tr:last-child{border-bottom:none}
  td{padding:8px 12px;vertical-align:middle}
  .wendung{min-width:16rem}
  .en{color:hsl(var(--muted-foreground));min-width:8rem}
  .name{font-weight:600}
  svg{color:hsl(var(--foreground))}
  /* BEFORE: gap-1, button follows text */
  .before .cell{display:flex;align-items:center;gap:4px;min-width:0}
  /* AFTER: ml-auto pushes speaker to the right edge of the column */
  .after .cell{display:flex;align-items:center;gap:8px;min-width:0}
  .after .name{min-width:0}
  .after .spk{margin-left:auto;flex-shrink:0}
</style></head>
<body>
  <h1>Speaker-Buttons rechtsbündig (Redemittel / Kollokationen / Wörter)</h1>

  <h2>Vorher · Button klebt am Text (unterschiedliche Position)</h2>
  <div class="wrap before"><table><thead><tr><th>Wendung</th><th>Englisch</th></tr></thead><tbody id="b"></tbody></table></div>

  <h2>Nachher · alle Buttons rechtsbündig</h2>
  <div class="wrap after"><table><thead><tr><th>Wendung</th><th>Englisch</th></tr></thead><tbody id="a"></tbody></table></div>

  <script>
    const rows=[
      ["Als Kompromiss schlage ich vor, …","As a compromise, I suggest …"],
      ["Wir könnten uns in der Mitte treffen.","We could meet in the middle."],
      ["Damit könnte ich leben.","I could live with that."],
      ["Wie wäre es mit einer Zwischenlösung?","How about an interim solution?"],
      ["Ich bin bereit, einen Schritt nachzugeben.","I'm willing to give a little."],
      ["Das klingt nach einem fairen Kompromiss.","That sounds like a fair compromise."],
      ["Einigen wir uns in der Mitte.","Let's settle in the middle."],
    ];
    const spk='<span class="spk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></span>';
    for(const [de,en] of rows){
      document.getElementById('b').insertAdjacentHTML('beforeend',`<tr><td class="wendung"><div class="cell"><span class="name">${de}</span>${spk}</div></td><td class="en">${en}</td></tr>`);
      document.getElementById('a').insertAdjacentHTML('beforeend',`<tr><td class="wendung"><div class="cell"><span class="name">${de}</span>${spk}</div></td><td class="en">${en}</td></tr>`);
    }
  </script>
</body></html>
